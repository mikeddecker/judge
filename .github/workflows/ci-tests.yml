name: CI - Tests and Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    name: API Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run API tests via Docker Compose
        run: |
          make ci-dev-test

      - name: Clean up
        if: always()
        run: make ci-dev-test-down

  web-tests:
    name: Web Tests (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint
        working-directory: ./web
        run: npm run lint || true

      - name: Run tests
        working-directory: ./web
        run: npm run test

      - name: Build
        working-directory: ./web
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ api, web ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: judge-${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: [ api-tests, web-tests ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Start dev services (CI profile — no computervision)
        run: |
          make ci-dev

      - name: Wait for API readiness
        run: |
          echo "Waiting for API liveness..."
          for i in {1..30}; do
            if curl -fsS http://localhost:5566/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API liveness check timed out"
              exit 1
            fi
            sleep 5
          done

          echo "Waiting for API readiness..."
          for i in {1..30}; do
            if curl -fsS http://localhost:5566/health/readiness >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API readiness check timed out"
              exit 1
            fi
            sleep 5
          done

      - name: Run smoke tests
        run: |
          echo "Testing API endpoints... openapi"
          curl -f http://localhost:5566/openapi.json || exit 1
          echo "Testing API endpoints... health"
          curl -f http://localhost:5566/health || exit 1
          echo "Testing health readiness"
          curl -f http://localhost:5566/health/readiness || exit 1

          echo "Testing Web (1/3)"
          curl -f http://localhost:5273/ || exit 1

          echo "Testing Web (2/3)"
          curl -f https://localhost:5273/ || exit 1
      - name: Clean up
        if: always()
        run: make ci-dev-down

  migration-test:
    name: Database Migration Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: judge_db
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './api/requirements.txt'

      - name: Install dependencies
        working-directory: ./api
        run: |
          pip install -q alembic sqlalchemy pymysql flask flask-migrate cryptography

      - name: Run migrations
        working-directory: ./api
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DOCKER_PORT: 3306
          MYSQL_USERNAME: root
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: judge_db
        run: |
          alembic upgrade head

      - name: Verify schema
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: judge_db
        run: |
          mysql -h 127.0.0.1 -u root -proot judge_db -e "SHOW TABLES;" | grep -E "Accounts|Videos|Jobs"

